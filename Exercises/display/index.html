<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/style.css">
    <title>Display Exercicio</title>
</head>

<body>
    <header>
        <h1>Carros e Bicicletas</h1>
    </header>
    <main>
        <section class="container-section">
            <h2>Carro: <span class="color-price">R$ 100,00</span></h2>
            <p>Carro modelo <span class="color-price">2023</span>, com <span class="color-price">10000</span> km rodados. </p>
            <button>Comprar Carro</button>
        </section>
        <section class="container-section">
            <h2>Bicicleta: <span class="color-price">R$ 50,00</span></h2>
            <p>Bicicleta modelo <span class="color-price">2021</span>, com <span class="color-price">10000</span> km rodados. </p>
            <button>Comprar Bicicleta</button>
        </section>
    </main>
</body>

</html>
